name: Ryzix Player CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Generate Gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode stable signing keystore
        run: |
          base64 -d app/signing/ryzix-signing.b64 > app/signing/ryzix-signing.p12
          echo "KEYSTORE_FILE=${{ github.workspace }}/app/signing/ryzix-signing.p12" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=ryzix1234"  >> $GITHUB_ENV
          echo "KEY_ALIAS=ryzix-key"           >> $GITHUB_ENV
          echo "KEY_PASSWORD=ryzix1234"         >> $GITHUB_ENV

      - name: Compute version tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            COMMIT_COUNT=$(git rev-list --count HEAD)
            TAG="v0.0.${COMMIT_COUNT}-beta"
          fi
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Computed version tag: ${TAG}"

      - name: Prepare log folder
        run: mkdir -p build-logs

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build-logs/debug-build.log
          exit ${PIPESTATUS[0]}

      - name: Build release APK (R8 minified + signed)
        run: |
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build-logs/release-build.log
          exit ${PIPESTATUS[0]}

      - name: Rename APKs with version string
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/Ryzix-Player-${TAG}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/Ryzix-Player-${TAG}-release.apk"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ryzix-Player-${{ env.TAG }}-debug
          path: app/build/outputs/apk/debug/Ryzix-Player-*-debug.apk
          retention-days: 30

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ryzix-Player-${{ env.TAG }}-release
          path: app/build/outputs/apk/release/Ryzix-Player-*-release.apk
          retention-days: 30

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Publish GitHub Release
        if: >
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Ryzix Player ${{ env.TAG }}"
          body: |
            ## Ryzix Player ${{ env.TAG }}

            **Automated release - R8 minified, signed with stable release key**

            ### Downloads
            | File | Description |
            |------|-------------|
            | `*-release.apk` | Install this - optimised, R8 minified |
            | `*-debug.apk` | Debug build with verbose logging |

            ### How to install
            1. Download `*-release.apk` below
            2. Transfer to your phone
            3. Open it, tap Install (enable Install unknown apps if prompted)
            4. Future updates install directly without uninstalling first

            ### Requirements
            Android 7.0 (API 24) or higher

            ---
            Commit: `${{ github.sha }}` - Build #${{ github.run_number }}
          draft: false
          prerelease: ${{ contains(env.TAG, 'alpha') || contains(env.TAG, 'beta') }}
          files: |
            app/build/outputs/apk/release/Ryzix-Player-*-release.apk
            app/build/outputs/apk/debug/Ryzix-Player-*-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save build logs to repo
        if: always()
        run: |
          mkdir -p build-logs

          LOG_FILE="build-logs/run-${{ github.run_number }}-${TAG}.log"

          {
            echo "=================================================="
            echo "  Ryzix Player - Build Log"
            echo "  Run:     #${{ github.run_number }}"
            echo "  Version: ${TAG}"
            echo "  Date:    $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Commit:  ${{ github.sha }}"
            echo "  Trigger: ${{ github.event_name }}"
            echo "=================================================="
            echo ""
            echo "## DEBUG BUILD"
            echo "--------------------------------------------------"
            cat build-logs/debug-build.log 2>/dev/null || echo "(debug build did not run)"
            echo ""
            echo "## RELEASE BUILD"
            echo "--------------------------------------------------"
            cat build-logs/release-build.log 2>/dev/null || echo "(release build did not run)"
          } > "${LOG_FILE}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add build-logs/
          git diff --cached --quiet || git commit -m "ci(logs): run #${{ github.run_number }} - ${TAG}"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
